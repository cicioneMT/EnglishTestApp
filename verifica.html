<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificare raport · English Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bara-sus">
    <div class="sigla"><span class="sigla-semn">E</span> English Test</div>
    <div class="info-elev">Verificare raport</div>
  </header>
  <main>
    <section class="ecran">
      <div class="card">
        <h1>Verificarea unui raport</h1>
        <p class="subtitlu">Scanați codul QR din PDF-ul elevului cu camera telefonului, sau lipiți mai jos linkul din codul QR.</p>
        <form id="form-verif" class="form-verif">
          <input id="cod" placeholder="Lipiți aici linkul sau codul" autocomplete="off">
          <button class="btn btn-principal" type="submit">Verifică</button>
        </form>
      </div>
      <div id="rezultat"></div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/verifica.js"></script>
</body>
</html>
